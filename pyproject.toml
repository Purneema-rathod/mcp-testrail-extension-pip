[project]
name = "mcp-testrail-tool"
version = "1.0.0"
description = "Goose-compatible TestRail tools"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "mcp[cli]",
    "python-dotenv"
]

[project.scripts]
mcp-testrail-tool = "mcp_testrail_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_testrail_tool"]
